<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kaarten — galerij</title>
<link rel="stylesheet" href="../../platform/web/css/cards.css">
<style>
/* Gallery page styling only (not part of the app). */
body {
  margin: 0;
  font: 14px/1.4 system-ui, sans-serif;
  color: #e9efe9;
  background: radial-gradient(ellipse at 50% 30%, #2c7a4b 0%, #1d5a37 55%, #123d26 100%);
}

main { padding: 16px 20px 40px; }

h2 {
  margin: 22px 0 8px;
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 0.02em;
  color: #f3e3b0;
}

.row {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: flex-end;
  margin-bottom: 8px;
}

.row.tight { gap: 5px; }

.label {
  width: 70px;
  flex: none;
  font-size: 12px;
  color: #bcd3c2;
}

.fan {
  position: relative;
  height: calc(var(--card-w) * 1.75);
  width: calc(var(--card-w) * (1 + 0.3 * 7) + 80px);
  padding: calc(var(--card-w) * 0.5) 0 calc(var(--card-w) * 0.35);
}

.fan .card {
  position: absolute;
  bottom: calc(var(--card-w) * 0.35);
  transform-origin: 50% 160%;
}

.states .cell {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  width: 110px;
  padding-top: 24px;
}

.states .cell span { font-size: 12px; color: #cfe0d4; }

.dark-ui {
  display: inline-flex;
  gap: 10px;
  align-items: center;
  padding: 8px 12px;
  border-radius: 10px;
  background: #1b1f24;
  font-size: 22px;
}
</style>
<script type="module" src="cards-gallery.mjs"></script>
</head>
<body>
<main id="gallery"></main>
</body>
</html>
