# nginx for the web container of every game's pod (<game>-web): serves the
# game's files, platform/web and games/<game>/web, and proxies the game server. The
# image build renders @SITE@, @TITLE@ and @VERB@ with the game's settings
# (games/<game>/<game>.mk) and installs the result as /etc/nginx/nginx.conf
# (see Containerfile), checking it with `nginx -t`.
#
# Runs as nginx-unprivileged's uid 101 on a read-only root: everything nginx
# writes goes to /tmp or /var/cache/nginx, both tmpfs in the quadlet.
#
# add_header and proxy_set_header do NOT merge across levels: a location that
# sets one of its own silently drops every inherited one. So both are set once,
# in `server`, and what varies by path comes from a map. A map that yields ""
# emits no header.
#
# The security headers live here, in git, HSTS included, and NPM passes them
# through. Not in Nginx Proxy Manager's Advanced box: NPM puts that at server
# level, and its own `location /` sets X-Served-By, so by the rule above a
# header pasted there is never sent. Browsers ignore HSTS over plain HTTP, so
# the loopback checks are unaffected.

worker_processes 2;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    # A player holds two: the websocket from NPM and the one to the server.
    worker_connections 2048;
}

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    include /etc/nginx/mime.types;
    types {
        application/manifest+json webmanifest;
    }
    default_type application/octet-stream;
    charset utf-8;
    charset_types text/css text/plain application/javascript application/json
                  application/manifest+json image/svg+xml;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    # Nothing is uploaded; websocket frames are not request bodies.
    client_max_body_size 16k;

    # NPM logs every request at the edge, with query strings redacted. A second
    # access log here would only repeat it, with more detail.
    access_log off;

    gzip on;
    gzip_vary on;
    gzip_min_length 512;
    gzip_types text/css text/plain application/javascript application/json
               application/manifest+json image/svg+xml;

    # The client address. NPM sets X-Real-IP to the address it saw; NPM reaches
    # the pod through the published loopback port, and the pod's network
    # (pasta with --host-lo-to-ns-lo, see deploy/game.pod.in) delivers
    # those connections from 127.0.0.1. Only that hop is trusted; from any
    # other peer the header is ignored. The server gets the result in X-Real-IP.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header X-Real-IP;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ""      close;
    }

    # html, js, css, json and the manifest revalidate on every load (ETag), so
    # a deploy is picked up at once; images may be kept for a day, but not a
    # 404 for one, which would outlive the deploy that adds it. The server's
    # own responses keep whatever it sets.
    map $uri $kj_cache_path {
        default                   "no-cache";
        "~*\.(?:svg|png|ico)$"    "public, max-age=86400";
        "/ws"                     "";
        "~^/api/"                 "";
    }
    map "$status:$kj_cache_path" $kj_cache {
        "~^404:public"            "no-cache";
        default                   $kj_cache_path;
    }

    server {
        listen 8080 default_server;
        server_name _;
        root /usr/share/nginx/html;

        # Everything the game needs is same-origin: no CDN, no web fonts, no
        # analytics. The websocket is listed for browsers that do not count
        # wss: as 'self'.
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self' wss://@SITE@; img-src 'self' data:; style-src 'self'; script-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'none'" always;
        # Leave NPM's "HSTS Enabled" off, or browsers get this twice.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # The page itself may use the camera and microphone, for calling the
        # table (issue #43); the browser still asks the player first.
        add_header Permissions-Policy "geolocation=(), microphone=(self), camera=(self), payment=(), usb=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cache-Control $kj_cache always;

        # For /ws and /api/. $http_host keeps the port, so the server's Origin
        # check also passes when the pod is tested on http://127.0.0.1:8093.
        # X-Forwarded-For is dropped: X-Real-IP is the one client address.
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        location = /ws {
            proxy_pass http://127.0.0.1:8081;
            # The server pings a connection quiet for 25 s (the page pings every
            # 20 s itself); this only bounds a dead connection.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # The score sheets of games at a real table, a websocket as /ws (only
        # a game that has them answers it; docs/toepen.md §9).
        location = /api/score {
            proxy_pass http://127.0.0.1:8081;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        location /api/ {
            proxy_pass http://127.0.0.1:8081;
        }

        location = / {
            try_files /index.html =404;
        }

        # A join link, https://@SITE@/ABCD: the app reads the code from the path.
        location ~ "^/[A-Za-z]{4}$" {
            try_files /index.html =404;
        }

        location / {
            try_files $uri =404;
        }

        error_page 404 @notfound;
        location @notfound {
            # Without its own (empty) types the page would be typed by the
            # URI's extension: a missing /x.png would say image/png.
            types { }
            default_type text/html;
            return 404 '<!doctype html><html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="dark light"><title>Niet gevonden - @TITLE@</title><h1>Deze pagina bestaat niet</h1><p>Zoek je een spel? Een spelcode heeft vier letters, zoals /KQXB.</p><p><a href="/">Terug naar @VERB@</a></p></html>\n';
        }
    }
}
