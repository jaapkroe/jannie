# The games' proxy hosts in Nginx Proxy Manager, as set up by hand: one per game
# (deploy/games/<game>.mk), all with the same settings but the name and the port.
#
# Committed here because NPM keeps its configuration in a SQLite database that
# is in no git repository: this file is the record of what was set.
#
# The Advanced box stays empty: every header, HSTS included, comes from the pod,
# and the header comment of deploy/nginx.conf says why a header pasted there
# would never be sent.

# The proxy hosts. Domain Name is the game's SITE, Forward Port its ADDR's port:
#   Domain Name             Forward Port    ID
#   klaverjas.kroes.dev     8093            37
#   toepen.kroes.dev        8095            …       (fill in once made)

# The settings of each, all of them checkboxes or fields:
#   Domain Names            the game's SITE (above)
#   Scheme                  http
#   Forward Hostname / IP   127.0.0.1
#   Forward Port            the game's port (above; ADDR in deploy/games/<game>.mk)
#   Cache Assets            OFF             (the pod sets Cache-Control itself;
#                                            NPM's cache would hide a deploy)
#   Block Common Exploits   ON
#   Websockets Support      ON              (the game runs over /ws; without it
#                                            the page loads and never connects)
#   SSL: the existing *.kroes.dev wildcard certificate, Force SSL ON
#        (never request a new certificate for a game's name)
#   SSL: HTTP/2 Support     OFF             (as set, like most proxy hosts here;
#                                            ON works as well)
#   SSL: HSTS Enabled       OFF             (the pod sends HSTS; with this on
#                                            browsers get it twice)
#   Advanced                empty
#   Access list: publicly accessible        (strangers join by link)
