# Paste into the klaverjas.kroes.dev proxy host's Advanced box in Nginx Proxy
# Manager.
#
# Committed here because NPM keeps its configuration in a SQLite database that
# is in no git repository: this file is the record of what was typed in.
#
# Every other header (CSP and friends) comes from the pod itself
# (deploy/nginx.conf). HSTS is the exception: it is a statement about TLS, and
# NPM is what terminates TLS.

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Proxy host settings that are checkboxes rather than config:
#   Domain Names            klaverjas.kroes.dev
#   Scheme                  http
#   Forward Hostname / IP   127.0.0.1
#   Forward Port            8093            (ADDR in the Makefile)
#   Cache Assets            OFF             (the pod sets Cache-Control itself;
#                                            NPM's cache would hide a deploy)
#   Block Common Exploits   ON
#   Websockets Support      ON              (the game runs over /ws; without it
#                                            the page loads and never connects)
#   SSL: the existing *.kroes.dev wildcard certificate, Force SSL ON, HTTP/2 ON
#        (never request a new certificate for this name)
#   Access list: publicly accessible        (strangers join by link)
